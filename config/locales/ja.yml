ja:
  date:
    formats:
      default: "%Y/%m/%d"
      short: "%m/%d"
      long: "%Y年%m月%d日(%a)"
    day_names: [日曜日, 月曜日, 火曜日, 水曜日, 木曜日, 金曜日, 土曜日]
    abbr_day_names: [日, 月, 火, 水, 木, 金, 土]
    month_names: [null, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    abbr_month_names: [null, 1月, 2月, 3月, 4月, 5月, 6月, 7月, 8月, 9月, 10月, 11月, 12月]
    order: ["year", "month", "day"]

  activerecord:
    attributes:
      user:
        nickname: ニックネーム
        last_name: 姓
        first_name: 名
        last_name_kana: 姓（カナ）
        first_name_kana: 名（カナ）
        birth_date: 生年月日
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
      product:
        image: 画像
        name: 商品名
        info: 商品の説明
        price: 価格
        category_id: カテゴリー
        sales_status_id: 商品の状態
        shipping_fee_status_id: 配送料の負担
        prefecture_id: 発送元の地域
        scheduled_delivery_id: 発送までの日数
    errors:
      models:
        user:
          attributes:
            email:
              taken: は既に使用されています
        product:
          attributes:
            image:
              blank: を添付してください

      messages:
        blank: を入力してください
        confirmation: と%{attribute}の入力が一致しません
        invalid: は不正な値です
        too_short: は%{count}文字以上で入力してください
        other_than: を選択してください
        not_a_number: は数値で入力してください
        greater_than_or_equal_to: は%{count}以上の値にしてください
        less_than_or_equal_to: は%{count}以下の値にしてください
        required: を入力してください

  devise:
    errors:
      messages:
        too_short: "%{attribute}は%{count}文字以上で入力してください"
        taken: は既に使用されています
        not_found: が見つかりません
        password_length: パスワードは%{count}文字以上で入力してください

    sessions:
      signed_in: ログインしました
      signed_out: ログアウトしました

    registrations:
      signed_up: アカウント登録が完了しました

  activemodel:
    attributes:
      order_address:
        token: クレジットカード情報
        postal_code: 郵便番号
        prefecture_id: 都道府県
        city: 市区町村
        addresses: 番地
        phone_number: 電話番号
        user_id: ユーザー
        product_id: 商品
    errors:
      models:
        order_address:
          attributes:
            token:
              blank: を入力してください
            postal_code:
              blank: を入力してください
              invalid: はハイフンを含んだ半角数字で正しく入力してください
            prefecture_id:
              other_than: を入力してください
            city:
              blank: を入力してください
            addresses:
              blank: を入力してください
            phone_number:
              blank: を入力してください
              invalid: はハイフンなしの10桁または11桁の半角数字で入力してください
            user_id:
              blank: を入力してください
            product_id:
              blank: を入力してください

